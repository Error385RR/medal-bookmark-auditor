[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medal-bookmark-auditor"
version = "0.1.0"
description = "Read-only auditor for Medal clip and bookmark metadata in SQLite"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]

[project.scripts]
medal-audit = "medal_audit:main"

[tool.setuptools]
py-modules = ["medal_audit"]
